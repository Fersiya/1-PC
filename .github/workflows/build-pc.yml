name: Build LumaLink Windows EXE

on:
  push:
    branches: [ main, master ]
    paths:
      - 'lumalink.py'
      - 'luma/**'
      - 'requirements.txt'
      - 'icon.ico'
      - '.github/workflows/build-pc.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build LumaLink GUI EXE
        run: |
          pyinstaller --onefile --windowed --clean --icon=icon.ico --name LumaLink lumalink.py

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumaLink-Windows
          path: dist/LumaLink.exe

      - name: Remove previous latest release (so its date updates)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --cleanup-tag --yes || true

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: LumaLink Windows (Latest)
          files: dist/LumaLink.exe
